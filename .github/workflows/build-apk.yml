name: Build APK

on:
  push:
    paths:
      - "App/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  APP_ID: io.github.alimhbtwenty.labnotebook
  APP_NAME: دفتر آزمایشگاه
  VERSION_NAME: 1.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          set -euo pipefail
          mkdir -p build/www/fonts
          cp App/index.html build/www/index.html
          cd build
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/preferences@7 vazirmatn@33
          cp "node_modules/vazirmatn/fonts/webfonts/Vazirmatn[wght].woff2" www/fonts/vazirmatn.woff2
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "auto", "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Icon, splash and version
        working-directory: build/android/app
        run: |
          set -euo pipefail
          RES=src/main/res
          find "$RES" -name 'splash.png' -delete
          cat > "$RES/values/lab_colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="lab_bg">#2B56C9</color></resources>
          EOF
          cat > "$RES/drawable/splash.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/lab_bg"/>
          </layer-list>
          EOF
          sed -i 's/#FFFFFF/#2B56C9/' "$RES/values/ic_launcher_background.xml"
          cat > "$RES/drawable/ic_lab_fg.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M30,36 h48 a6,6 0 0 1 6,6 v24 a6,6 0 0 1 -6,6 h-48 a6,6 0 0 1 -6,-6 v-24 a6,6 0 0 1 6,-6 z"
                android:strokeColor="#FFFFFF" android:strokeWidth="4" android:fillColor="#00000000"/>
            <path android:pathData="M37,46 L47,54 L37,62" android:strokeColor="#FFFFFF" android:strokeWidth="5"
                android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
            <path android:pathData="M54,62 L70,62" android:strokeColor="#FFFFFF" android:strokeWidth="5"
                android:strokeLineCap="round" android:fillColor="#00000000"/>
          </vector>
          EOF
          for f in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$f.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_lab_fg"/>
          </adaptive-icon>
          EOF
          done
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle

      - name: Build APK
        working-directory: build/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT="$GITHUB_WORKSPACE/lab-notebook-${VERSION_NAME}.apk"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lab.p12"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/lab.p12" --ks-type PKCS12 --ks-pass pass:labnotebook \
              --ks-key-alias lab --key-pass pass:labnotebook --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$OUT" | head -3
            rm -f "$RUNNER_TEMP/lab.p12"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 is not set - building a DEBUG APK."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi
          echo "APK=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lab-notebook-${{ env.VERSION_NAME }}
          path: ${{ env.APK }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.VERSION_NAME }}
          name: Lab Notebook ${{ env.VERSION_NAME }}
          make_latest: true
          files: ${{ env.APK }}
          body: |
            Lab Notebook APK (signing: ${{ env.SIGNING }}).
            Download the .apk under Assets and install it.
